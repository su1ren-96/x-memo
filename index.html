/* X-style compact post typography and responsive action bar */
.posttext{line-height:1.34;margin:5px 0 7px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.posthead{line-height:1.3}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(25px,.58fr) minmax(25px,.58fr);align-items:center;gap:0;width:100%;margin-top:10px}
.actions button{display:inline-flex;align-items:center;justify-content:flex-start;gap:4px;min-width:0;width:100%;padding:5px 0;color:var(--muted);font-size:12px;line-height:1.2;white-space:nowrap}
.actions button:nth-last-child(-n+2){justify-content:flex-end}
.actions .action-svg{width:19px;height:19px;min-width:19px;flex:none;display:block}
.actions span{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
@media(max-width:370px){.post{gap:8px;padding-left:10px;padding-right:10px}.actions .action-svg{width:17px;height:17px;min-width:17px}.actions button{gap:2px}.actions span{font-size:11px}}
/* Fix: never truncate engagement counts; distribute natural-width groups. */
.actions{display:flex;align-items:center;justify-content:space-between;gap:clamp(2px,.7vw,7px);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.actions::-webkit-scrollbar{display:none}
.actions button{flex:0 0 auto;width:auto;min-width:max-content;justify-content:center;gap:3px;padding:5px 0}
.actions button:nth-last-child(-n+2){justify-content:center}
.actions span{overflow:visible;text-overflow:clip;white-space:nowrap;flex:0 0 auto;font-size:clamp(10px,2.8vw,12px)}
.actions .action-svg{width:clamp(16px,4.5vw,19px);height:clamp(16px,4.5vw,19px);min-width:0}
@media(max-width:390px){.actions{gap:2px}.actions button{gap:2px}}


/* Compact timeline: the first line of text starts directly under the account heading. */
.post:not(.detail-post) .posthead{min-height:0;line-height:1.22}
.post:not(.detail-post) .posttext{margin-top:2px;margin-bottom:7px;line-height:1.34}
.post:not(.detail-post) .postbody>.muted.small+.posttext{margin-top:3px}
/* Expanded post: author occupies the top row; text and attachments use full width. */
.post.detail-post{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:11px;row-gap:0;padding:15px 14px 12px}
.post.detail-post>.avatar-link{grid-column:1;grid-row:1;align-self:start}
.post.detail-post>.postbody{display:contents}
.post.detail-post .posthead{grid-column:2;grid-row:1;display:flex;flex-wrap:wrap;align-content:start;align-items:center;gap:2px 5px;position:relative;padding:2px 34px 0 0;min-height:46px}
.post.detail-post .posthead>b{max-width:100%;line-height:1.24}
.post.detail-post .posthead>.muted.small{flex:0 0 100%;width:100%;font-size:14px;line-height:1.3}
.post.detail-post .posthead>.iconbtn{position:absolute;right:0;top:0;margin:0!important}
.post.detail-post .posttext{grid-column:1/-1;margin:13px 0 8px;line-height:1.42;font-size:16px}
.post.detail-post .media,.post.detail-post .linkcard,.post.detail-post .quote,.post.detail-post .actions,.post.detail-post .repost-label{grid-column:1/-1}
.post.detail-post .media{margin:8px 0 12px}
.post.detail-post .actions{margin-top:13px}
.post.detail-post .postbody>.muted.small{grid-column:1/-1}

function searchResults(){let inp=$('searchInput'),results=$('results');if(!inp||!results)return;query=inp.value;results.innerHTML=searchResultsHTML()}function go(p){page=p;render();scrollTo(0,0)}function showProfile(id){profileId=id;profileTab='posts';go('profile')}function showDetail(id){detailId=id;go('detail')}async function setTheme(t){await setSetting({theme:t});render()}async function toggleAction(kind,pid){let aid=me().id,x=state[kind].find(x=>x.postId===pid&&x.accountId===aid);if(x)await del(kind,x.id);else{await put(kind,{id:uid(),postId:pid,accountId:aid,created:now()});if(kind==='likes')notify(post(pid)?.author,aid,'like',pid)}render()}async function toggleFollow(id){let a=me().id,x=state.follows.find(f=>f.from===a&&f.to===id);if(x)await del('follows',x.id);else{await put('follows',{id:uid(),from:a,to:id});notify(id,a,'follow')}render()}function openModal(html){modal=html;renderModal()}function closeModal(){modal=null;renderModal()}function renderModal(){$('modalRoot').innerHTML=modal?`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><b>X Memo</b><button class="iconbtn" onclick="closeModal()">✕</button></div>${modal}</div></div>`:''}function accountList(){openModal(`<h3>アカウント</h3>${state.accounts.map(a=>`<button class="menuitem row" onclick="switchAccount('${a.id}')">${avatar(a,'small')} <span><b>${esc(a.name)}</b><div class="muted small">@${esc(a.handle)}</div></span> ${a.id===me().id?'✓':''}</button>`).join('')}<button class="menuitem" onclick="editAccount()">＋ アカウントを追加</button><button class="menuitem" onclick="closeModal();showProfile(me().id)">プロフィールを開く</button><button class="menuitem" onclick="closeModal();go('likes')">いいねしたポスト</button><button class="menuitem" onclick="closeModal();go('settings')">設定とバックアップ</button>`)}async function switchAccount(id){await setSetting({active:id});closeModal();go('home')}function field(label,name,value='',type='text'){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}function editAccount(id){let a=account(id)||{},isNew=!id;openModal(`<h3>${isNew?'アカウントを作成':'プロフィールを編集'}</h3><form id="accountForm" onsubmit="saveAccount(event,'${id||''}')">${field('表示名','name',a.name||'')}${field('@ID（英数字と_）','handle',a.handle||'')}${field('自己紹介','bio',a.bio||'')}${field('所在地','location',a.location||'')}${field('Webサイト','website',a.website||'')}${field('誕生日','birthday',a.birthday||'','date')}${field('フォロー数','following',a.following||0,'number')}${field('フォロワー数','followers',a.followers||0,'number')}<div class="field"><label>認証バッジ</label><select name="verified"><option value="">なし</option><option value="blue" ${a.verified==='blue'?'selected':''}>青</option><option value="gold" ${a.verified==='gold'?'selected':''}>金</option><option value="gray" ${a.verified==='gray'?'selected':''}>グレー</option></select></div><div class="field"><label>アイコン</label><input type="file" name="avatarFile" accept="image/*"></div><div class="field"><label>ヘッダー</label><input type="file" name="bannerFile" accept="image/*"></div><button class="primary">保存する</button>${!isNew?` <button type="button" class="secondary danger" onclick="deleteAccount('${id}')">アカウントを削除</button>`:''}</form>`)}async function storeBlob(file){let id=uid();let blob=file instanceof Blob?file:new Blob([file]);await put('media',{id,blob,type:blob.type||'application/octet-stream',name:file.name||'media'});mediaCache.set(id,URL.createObjectURL(blob));return id}async function saveAccount(e,id){e.preventDefault();let f=e.target,d=new FormData(f),handle=String(d.get('handle')).replace(/^@/,'').trim();if(!/^[A-Za-z0-9_]{1,30}$/.test(handle))return alert('@IDは英数字とアンダースコアで入力してください');if(state.accounts.some(a=>a.handle.toLowerCase()===handle.toLowerCase()&&a.id!==id))return alert('この@IDは使用されています');let old=account(id)||{},a={...old,id:id||uid(),created:old.created||now()};for(let k of ['name','bio','location','website','birthday','verified'])a[k]= function compose(mode='new',target='',editId=''){let p=post(editId)||{},kind=mode==='edit'?(p.replyTo?'reply':p.quoteId?'quote':'new'):mode;composer={mode:kind,editId,replyTo:mode==='reply'?target:p.replyTo||'',quoteId:mode==='quote'?target:p.quoteId||'',author:p.author||me().id,media:[...(p.media||[])]};openModal(`<h3>${editId?'ポストを編集':kind==='reply'?'返信する':kind==='quote'?'引用ポスト':'新しいポスト'}</h3><form id="postForm" onsubmit="savePost(event)"><div class="field"><label>投稿アカウント</label><select name="author">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===composer.author?'selected':''}>${esc(a.name)} (@${esc(a.handle)})</option>`).join('')}</select></div><div class="field"><label>本文</label><textarea name="text" id="postText" oninput="updateCounter()">${esc(p.text||'')}</textarea><div class="row between"><label><input type="checkbox" name="long" ${p.long?'checked':''} onchange="updateCounter()"> 長文モード（文字数制限なし）</label><span id="charCounter" class="counter"></span></div></div><div class="field"><label>画像・動画（画像は最大20枚）</label><input type="file" id="postFiles" multiple accept="image/*,video/*" onchange="prepareMedia(this.files)"><div id="mediaPreviews" class="row wrap">${composer.media.map(id=>mediaPreview(id)).join('')}</div></div>${field('投稿日時','created',(p.created||now()).slice(0,16),'datetime-local')}${field('返信数','replies',p.replies||0,'number')}${field('リポスト数','reposts',p.reposts||0,'number')}${field('いいね数','likes',p.likes||0,'number')}${field('表示回数','views',p.views||0,'number')}${field('ブックマーク数','bookmarks',p.bookmarks||0,'number')}<div class="field"><label>本家Xの投稿URL（任意）</label><input name="external" type="url" placeholder="https://x.com/.../status/..." value="${esc(p.external||'')}"></div><div class="field"><label><input type="checkbox" name="article" ${p.article?'checked':''}> 記事として表示</label></div><div class="field"><label><input type="checkbox" name="highlight" ${p.highlight?'checked':''}> ハイライトに表示</label></div><button class="primary">${editId?'変更を保存':'ポストする'}</button></form>`);updateCounter()}function mediaPreview(id){let m=state.media.find(m=>m.id===id);return m?`<div><img class="preview" src="${mediaUrl(id)}" onerror="this.style.opacity='.3'"><button class="iconbtn" onclick="removeMedia('${id}')">×</button></div>`:''}function removeMedia(id){composer.media=composer.media.filter(x=>x!==id);$('mediaPreviews').innerHTML=composer.media.map(mediaPreview).join('')}async function prepareMedia(files){let imageCount=composer.media.filter(id=>state.media.find(m=>m.id===id)?.type.startsWith('image/')).length;for(let f of files){if(f.type.startsWith('image/')){if(imageCount>=20){alert('画像は最大20枚です');break}imageCount++}if(!f.type.startsWith('image/')&&!f.type.startsWith('video/'))continue;try{composer.media.push(await storeBlob(f))}catch(e){alert('保存容量が不足している可能性があります: '+e.message);break}}$('mediaPreviews').innerHTML=composer.media.map(mediaPreview).join('')}function updateCounter(){let f=$('postForm');if(!f)return;let n=Array.from(f.elements.text.value).length;let long=f.elements.long.checked;let c=$('charCounter');if(c){c.textContent=long?`${n}文字・長文モード`:`${n} / 280文字`;c.style.color=!long&&n>280?'#f4212e':'var(--muted)'}}async function savePost(e){e.preventDefault();let f=e.target,d=new FormData(f),text=String(d.get('text')||''),long=!!d.get('long');if(!long&&Array.from(text).length>280)return alert('通常モードは280文字以内です');if(!text.trim()&&!composer.media.length&&!d.get('external'))return alert('本文・メディア・URLのいずれかを入力してください');let ext=String(d.get('external')||'').trim();if(ext){try{let u=new URL(ext);if(!['x.com','www.x.com','twitter.com','www.twitter.com','mobile.twitter.com'].includes(u.hostname)||!/^\/[^/]+\/status\/\d+/.test(u.pathname))return alert('XのポストURLを入力してください')}catch{return alert('正しいURLを入力してください')}}let old=post(composer.editId)||{},p={...old,id:old.id||uid(),author:String(d.get('author')),text,long,created:new Date(d.get('created')||now()).toISOString(),media:composer.media,replyTo:composer.replyTo,quoteId:composer.quoteId,external:ext,article:!!d.get('article'),highlight:!!d.get('highlight')};for(let k of ['replies','reposts','likes','views','bookmarks'])p[k]=Math.max(0,Number(d.get(k))||0);await put('posts',p);if(!composer.editId){if(p.replyTo)notify(post(p.replyTo)?.author,p.author,'reply',p.id);if(p.quoteId)notify(post(p.quoteId)?.author,p.author,'quote',p.id)}closeModal();showDetail(p.id)}function postMenu(id){let p=post(id),a=account(p?.author);openModal(`<h3>ポストの操作</h3><button class="menuitem" onclick="closeModal();showDetail('${id}')">ポストを表示</button><button class="menuitem" onclick="compose('edit','','${id}')">編集する</button><button class="menuitem" onclick="togglePin('${id}')">${a?.pinned===id?'固定を解除':'プロフィールに固定'}</button><button class="menuitem" onclick="toggleHighlight('${id}')">ハイライトを切り替え</button><button class="menuitem danger" onclick="deletePost('${id}')">削除する</button>`)}async function togglePin(id){let p=post(id),a=account(p.author);if(a){await put('accounts',{...a,pinned:a.pinned===id?'':id});closeModal();render()}}async function toggleHighlight(id){let p=post(id);await put('posts',{...p,highlight:!p.highlight});closeModal();render()}async function deletePost(id,confirmFirst=true){if(confirmFirst&&!confirm('このポストを削除しますか？'))return;await del('posts',id);for(let kind of ['likes','bookmarks','reposts','notifications'])for(let x of [...state[kind]])if(x.postId===id)await del(kind,x.id);closeModal();if(confirmFirst)go('home')}function repostMenu(id){openModal(`<h3>リポスト</h3><button class="menuitem" onclick="toggleRepost('${id}')">${isOn('reposts',id)?'リポストを取り消す':'リポストする'}</button><button class="menuitem" onclick="compose('quote','${id}')">引用ポストする</button>`)}async function toggleRepost(id){let aid=me().id,x=state.reposts.find(x=>x.accountId===aid&&x.postId===id);if(x)await del('reposts',x.id);else{await put('reposts',{id:uid(),postId:id,accountId:aid,created:now()});notify(post(id)?.author,aid,'repost',id)}closeModal();render()}function gallery(id,index){let p=post(id),items=(p?.media||[]).map(x=>state.media.find(m=>m.id===x)).filter(Boolean);if(!items.length)return;let m=items[index]||items[0];openModal(`<div class="row between"><button class="secondary" onclick="gallery('${id}',${(index-1+items.length)%items.length})">‹ 前へ</button><span>${index+1} / ${items.length}</span><button class="secondary" onclick="gallery('${id}',${(index+1)%items.length})">次へ ›</button></div><div style="text-align:center;padding:15px 0">${m.type.startsWith('video/')?`<video controls class="fullimg" src="${mediaUrl(m.id)}"></video>`:`<img class="fullimg" src="${mediaUrl(m.id)}">`}</div>`)}async function backup(){try{let data={format:'xmemo',version:1,exported:now(),settings:state.settings,accounts:state.accounts,posts:state.posts,follows:state.follows,likes:state.likes,bookmarks:state.bookmarks,reposts:state.reposts,notifications:state.notifications,media:[]};for(let m of state.media){let base64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(m.blob)});data.media.push({id:m.id,name:m.name,type:m.type,data:base64})}let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='xmemo-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('バックアップに失敗しました: '+e.message)}}async function restore(file){if(!file)return;if(!confirm('現在のX Memoデータをバックアップの内容で置き換えます。続けますか？'))return;try{let data=JSON.parse(await file.text());if(data.format!=='xmemo'||!Array.isArray(data.accounts)||!Array.isArray(data.posts))throw Error('X Memoのバックアップではありません');let decoded=[];for(let m of data.media||[]){let r=await fetch(m.data),blob=await r.blob();decoded.push({id:m.id,name:m.name,type:m.type,blob})}let names=['accounts','posts','follows','likes','bookmarks','reposts','notifications','media','settings'];let t=db.transaction(names,'readwrite');for(let n of names)t.objectStore(n).clear();for(let n of names.filter(n=>n!=='media'&&n!=='settings'))for(let x of data[n]||[])t.objectStore(n).put(x);t.objectStore('settings').put({...data.settings,id:'main'});for(let m of decoded)t.objectStore('media').put(m);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});location.reload()}catch(e){alert('復元に失敗しました: '+e.message+'。大容量のバックアップは分割が必要な場合があります')}}load().catch(e=>{$('app').innerHTML='<div class="empty">起動できませんでした: '+esc(e.message)+'</div>'});
</script></body></html>
